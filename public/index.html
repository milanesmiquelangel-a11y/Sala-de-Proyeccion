<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sala de Proyección — Generador de Video IA</title><style>body{margin:0;background:#15121a;color:#f1ebdd;font-family:Arial;line-height:1.5}.app{max-width:880px;margin:auto;padding:20px}.top{display:flex;justify-content:flex-end;gap:12px;align-items:center;color:#b8afa0}.panel{background:#1e1a24;border:1px solid #35303f;border-radius:6px;padding:24px;margin:24px 0}h1,h2{font-family:Georgia;font-weight:400}label{display:block;color:#b8afa0;margin:16px 0 7px}textarea,input,select{width:100%;box-sizing:border-box;background:#262030;color:#f1ebdd;border:1px solid #35303f;border-radius:4px;padding:12px}textarea{min-height:100px}.row{display:flex;gap:16px}.row>*{flex:1}button{padding:12px 18px;background:#e3b24c;border:0;border-radius:4px;font-weight:bold;cursor:pointer}.generate{width:100%;margin-top:16px}.status{color:#b8afa0}.polli{border-color:#4d4259}.polliStatus{margin:6px 0 14px;color:#b8afa0}.polli button{margin-right:8px}.disconnect{background:transparent;color:#e3b24c;border:1px solid #e3b24c}.screen{background:#09080d;border:6px solid #09080d;aspect-ratio:16/9;display:grid;place-items:center;overflow:hidden}.screen video{width:100%;height:100%;object-fit:contain}.screen video:not([src]){display:none}.history li{padding:12px 0;border-bottom:1px solid #35303f;cursor:pointer}.history button{float:right;background:transparent;color:#c05b4d;padding:3px}.thumb{max-width:160px;max-height:100px;display:none;margin-top:10px}@media(max-width:600px){.row{flex-direction:column;gap:0}.top{flex-wrap:wrap;font-size:14px}}</style></head><body><div class="app"><div class="top" id="top">Cargando…</div><header><h1>Sala de Proyección</h1><p>Genera vídeos con IA a partir de texto o una imagen de referencia.</p></header><section class="panel polli" id="polli"><h2>Cuenta de generación</h2><p class="polliStatus" id="polliStatus">Comprobando conexión con Pollinations…</p><button id="polliBtn">Conectar Pollinations</button></section><section class="panel"><h2>Generar vídeo</h2><label>Descripción de la escena</label><textarea id="prompt" placeholder="Ej: un perro dorado corriendo por la playa al atardecer, cámara lenta, luz cálida"></textarea><label>Imagen de referencia (opcional)</label><input id="image" type="file" accept="image/jpeg,image/png,image/webp"><img id="thumb" class="thumb"><div class="row"><div><label>Modelo</label><select id="model"><option value="seedance-2.0-fast">Seedance 2.0 Fast</option><option value="wan-fast">Wan-Fast</option><option value="veo">Veo</option></select></div><div><label>Relación</label><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select></div></div><label>Duración (segundos)</label><input id="duration" type="number" min="2" max="10" value="5"><label><input id="audio" type="checkbox" style="width:auto"> Generar audio (Veo)</label><button class="generate" id="go">Generar vídeo</button><p class="status" id="status"></p></section><section class="panel"><div class="screen"><video id="video" controls></video><span id="empty">Tu vídeo aparecerá aquí</span></div><p><a id="download" hidden download>Descargar MP4</a></p></section><section class="panel history"><h2>Historial</h2><ul id="list"></ul><p id="none">Todavía no hay vídeos.</p></section></div><script>const $=id=>document.getElementById(id);let history=[];async function session(){try{const r=await fetch('/api/me');if(!r.ok){location.href='/login.html';return}const u=await r.json();$('top').innerHTML=u.email+' <button id="out">Salir</button>';$('out').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login.html'}}catch(e){location.href='/login.html'}}async function loadPollinations(){try{const r=await fetch('/api/pollinations/status');if(!r.ok)return;const d=await r.json();const s=$('polliStatus'),b=$('polliBtn');if(!d.configured){s.textContent='El administrador todavía debe configurar la conexión de Pollinations en el servidor.';b.style.display='none';return}if(d.connected){s.textContent='Conectado. Las generaciones consumirán el saldo Pollen de tu propia cuenta de Pollinations.';b.textContent='Desconectar';b.className='disconnect';b.style.display='inline-block';b.onclick=async()=>{await fetch('/api/pollinations/disconnect',{method:'POST'});await loadPollinations()}}else{s.textContent='Conecta tu cuenta de Pollinations para pagar tus propias generaciones. Tú autorizas el presupuesto y puedes revocar el acceso.';b.textContent='Conectar Pollinations';b.className='';b.style.display='inline-block';b.onclick=()=>{location.href='/api/pollinations/connect'}}}catch(e){$('polliStatus').textContent='No se pudo comprobar la conexión con Pollinations.'}}async function load(){const r=await fetch('/api/history');if(!r.ok)return;const d=await r.json();history=d.generations||[];render()}function render(){$('list').innerHTML='';$('none').style.display=history.length?'none':'block';history.forEach((g,i)=>{const li=document.createElement('li');li.textContent=(i+1)+'. '+g.prompt+' — '+g.model;li.onclick=()=>show(g.videoUrl);const b=document.createElement('button');b.textContent='Eliminar';b.onclick=async e=>{e.stopPropagation();if(confirm('¿Eliminar este vídeo?')){const r=await fetch('/api/history/'+encodeURIComponent(g.id),{method:'DELETE'});if(r.ok){await load()}}};li.appendChild(b);$('list').appendChild(li)})}function show(url){if(!url)return;$('empty').style.display='none';$('video').src=url;$('video').style.display='block';$('download').href=url;$('download').hidden=false}$('image').onchange=()=>{const f=$('image').files[0];if(f){$('thumb').src=URL.createObjectURL(f);$('thumb').style.display='block'}};$('go').onclick=async()=>{const prompt=$('prompt').value.trim();if(!prompt){$('status').textContent='Describe la escena.';return}const btn=$('go');btn.disabled=true;$('status').textContent='Generando…';try{let imageUrl=null,imagePath=null;const f=$('image').files[0];if(f){const fd=new FormData();fd.append('image',f);const ur=await fetch('/api/upload',{method:'POST',body:fd});const ud=await ur.json();if(!ur.ok)throw Error(ud.error||'No se pudo subir la imagen.');imageUrl=ud.url;imagePath=ud.path}const r=await fetch('/api/generate-video',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,model:$('model').value,aspectRatio:$('ratio').value,duration:$('duration').value,audio:$('audio').checked,imageUrl,imagePath})});if(!r.ok){const d=await r.json().catch(()=>({}));if(r.status===401)await loadPollinations();throw Error(d.detail?`${d.error||'La generación falló.'} (${d.detail})`:d.error||'La generación falló.')}const blob=await r.blob();show(URL.createObjectURL(blob));$('status').textContent='Vídeo listo.';await load()}catch(e){$('status').textContent=e.message||'Error.'}finally{btn.disabled=false}};session();load();loadPollinations();const q=new URLSearchParams(location.search);if(q.get('pollinations')){setTimeout(()=>{const v=q.get('pollinations');$('status').textContent=v==='connected'?'Cuenta de Pollinations conectada correctamente.':v==='denied'?'Conexión con Pollinations cancelada.':'No se pudo completar la conexión con Pollinations.';window.history.replaceState({},'',location.pathname)},300)}};</script></body></html>
