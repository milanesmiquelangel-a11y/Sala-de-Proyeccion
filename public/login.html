<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sala de Proyección — Entrar</title><style>body{margin:0;background:#15121a;color:#f1ebdd;font-family:Arial;min-height:100vh;display:grid;place-items:center}.card{width:min(380px,90%);background:#1e1a24;padding:28px;border:1px solid #35303f;border-radius:6px}h1{text-align:center;font-family:Georgia}.tag{text-align:center;color:#b8afa0}label{display:block;margin:14px 0 6px;color:#b8afa0}input{width:100%;box-sizing:border-box;padding:12px;background:#262030;color:#f1ebdd;border:1px solid #35303f;border-radius:4px}button{width:100%;margin-top:18px;padding:13px;background:#e3b24c;border:0;border-radius:4px;font-weight:bold}.switch{text-align:center;color:#b8afa0}.switch a{color:#4f9c93;cursor:pointer}.msg{color:#c05b4d;min-height:20px}</style></head><body><main class="card"><h1>Sala de Proyección</h1><p class="tag">Inicia sesión para generar tus vídeos con IA</p><p class="msg" id="msg"></p><label>Correo</label><input id="email" type="email" autocomplete="email"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password"><button id="submit">Entrar</button><p class="switch">¿No tienes cuenta? <a id="toggle">Crear una</a></p></main><script>let mode='login';const $=id=>document.getElementById(id),render=()=>{$('submit').textContent=mode==='login'?'Entrar':'Crear cuenta';$('toggle').textContent=mode==='login'?'Crear una':'Entrar en vez de registrarme';$('msg').textContent=''};$('toggle').onclick=()=>{mode=mode==='login'?'register':'login';render()};$('submit').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').textContent='Completa correo y contraseña.';return}try{const r=await fetch(mode==='login'?'/api/login':'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok){$('msg').textContent=d.error||'Ocurrió un error.';return}location.href='/'}catch(e){$('msg').textContent='No se pudo conectar con el servidor.'}};render()</script></body></html>
